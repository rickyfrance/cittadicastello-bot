name: Aggiorna news.json

on:
  schedule:
    - cron: '30 6 * * *' # ogni giorno alle 6:30 UTC (7:30 in Italia in inverno), prima del bot
  workflow_dispatch: # avvio manuale dal pulsante "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leggi le novità del Comune
        run: node update-feed.mjs

      - name: Salva news.json se è cambiato
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add news.json
            git commit -m "Aggiorna news.json"
            git push
          fi
